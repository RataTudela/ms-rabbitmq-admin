version: '3.8'

services:
  ms-rabbitmq-admin:
    build: .
    container_name: ms-rabbitmq-admin
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - red-compartida

networks:
  red-compartida:
    external: true